<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Block Party</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;800;900&family=Barlow+Condensed:wght@600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* STARTER KIT (kit/README.md). Colours: change the five below and the game's whole look follows. */
:root{--bg:#1a2448;--ink:#f4f7ff;--acc:#ffc23a;--acc-dark:#c07a10;--ok:#9be3b5}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.tf{font-family:Rubik,"Barlow Condensed",Impact,"Arial Narrow",sans-serif;font-weight:900;letter-spacing:1px}
#pauseBtn{position:fixed;left:50%;transform:translateX(-50%);top:10px;z-index:3;width:40px;height:30px;border-radius:10px;border:0;background:rgba(0,0,0,.35);color:var(--ink);font-weight:800;cursor:pointer}
#pauseBtn.hidden{display:none}
.ov{position:fixed;inset:0;z-index:5;display:flex;align-items:safe center;justify-content:center;overflow-y:auto;background:radial-gradient(circle at 50% 30%,rgba(50,80,160,.6),rgba(10,14,36,.94))}
.ov.hidden,.btn.hidden{display:none}
.card{width:calc(100% - 44px);max-width:360px;text-align:center;max-height:100%;overflow:auto;padding:20px 0}
.card h1{margin:0;font-size:76px;line-height:.95;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.35),0 12px 28px rgba(0,0,0,.55)}
.card h2{margin:0;font-size:42px;line-height:1;color:#fff}
.bar{height:3px;width:150px;margin:10px auto 9px;background:linear-gradient(90deg,transparent,var(--acc),transparent)}
.tag{font-size:12px;font-weight:800;letter-spacing:2.5px;opacity:.85}
.vs{margin:18px 0 4px;font-size:12px;letter-spacing:2px;opacity:.7;font-weight:800}
.sub{opacity:.9;font-size:14px;margin:10px 0 0;line-height:1.5}
.stat{font-size:13px;margin-top:12px;opacity:.92;line-height:1.5}
.btn{display:block;width:100%;margin-top:16px;border:0;border-radius:14px;padding:16px;font:inherit;font-size:20px;font-weight:800;background:var(--acc);color:#fff;box-shadow:0 5px 0 var(--acc-dark);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--acc-dark)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border:1.5px solid rgba(238,242,248,.3);font-size:16px;padding:13px;margin-top:10px}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
#ovPause,#ovLevels{background:radial-gradient(circle at 50% 30%,rgba(14,18,28,.94),rgba(6,8,14,.97))}
.btn.quiet{border-color:transparent;opacity:.6;font-size:14px;padding:10px;margin-top:6px}
.rules{list-style:none;padding:0;margin:14px 0 0;text-align:left}
.rules li{padding:0 0 11px 0;font-size:14px;line-height:1.45;opacity:.95}
.rules b{color:var(--acc)}
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:16px;max-height:56vh;overflow:auto;padding:4px 2px}
.lvb{border:0;border-radius:12px;padding:10px 0 6px;font:inherit;font-weight:800;font-size:17px;background:rgba(255,255,255,.1);color:var(--ink);cursor:pointer}
.lvb small{display:block;font-size:10px;color:var(--acc);min-height:12px;letter-spacing:1px}
.lvb.boss{box-shadow:inset 0 0 0 2px var(--acc)}
.lvb.cur{background:var(--acc);color:#fff}.lvb.cur small{color:#fff}
.lvb.lock{opacity:.3}
.stars{font-size:34px;letter-spacing:6px;margin-top:8px;color:var(--acc)}
.stars .off{color:rgba(255,255,255,.2)}
.snd{position:absolute;right:14px;bottom:16px;width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:18px;cursor:pointer}
.nb{color:var(--acc)}.help{color:var(--ok);font-size:12.5px}
#skipTut{position:fixed;right:10px;top:10px;z-index:4;border:0;border-radius:16px;padding:8px 14px;font:inherit;font-weight:800;font-size:14px;background:var(--acc);color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.4);cursor:pointer}#skipTut.hidden{display:none}
.shop{margin-top:14px;text-align:left}.shop h3{margin:0 0 6px;font-size:13px;letter-spacing:2px;opacity:.8;display:flex;justify-content:space-between}
.shop .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.up{border:1.5px solid rgba(255,255,255,.18);border-radius:12px;padding:8px 9px;background:rgba(0,0,0,.25);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.up b{display:block;font-size:14px}.up small{display:block;font-size:11px;opacity:.75;line-height:1.3;margin-top:2px}.up .lv{font-size:11px;letter-spacing:2px;color:var(--acc)}.up .cost{float:right;font-weight:800;font-size:13px}
.up.can{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}.up.max{opacity:.5}.up.no{opacity:.55}.up.bought{animation:pop .35s}@keyframes pop{50%{transform:scale(1.06)}}
#ovPause,#ovLevels{background:radial-gradient(circle at 50% 30%,rgba(14,18,28,.94),rgba(6,8,14,.97))}

#eTitle{font-size:34px}.ledger{text-align:left;margin-top:10px;font-size:13px}.ledger .ln{display:flex;justify-content:space-between;background:rgba(255,255,255,.07);border-radius:9px;padding:6px 9px;margin-top:5px}.ledger .g{color:#9be3b5}.ledger .b{color:#ffb4a8}
.book{text-align:left;margin-top:10px;font-size:13.5px}.book .ln{display:flex;justify-content:space-between;background:rgba(255,255,255,.07);border-radius:9px;padding:7px 10px;margin-top:6px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button id="skipTut" class="hidden">Skip tutorial ›</button>
<button id="pauseBtn" class="hidden" aria-label="Pause">II</button>

<div class="ov" id="ovHome">
  <button class="snd" id="sndBtn" aria-label="Sound">🔊</button>
  <div class="card">
    <h1 class="tf" style="font-size:58px;color:#fff">Block<br><span style="color:#ffc23a">Party</span></h1>
    <div class="bar"></div>
    <div class="tag" id="hTag">DRAG. FILL. CLEAR.</div>
    <div class="vs">LEVEL <span id="hLvl">1</span></div>
    <div class="stat" id="hStat"></div>
    <button class="btn" id="playBtn">PLAY</button>
    <button class="btn ghost" id="levelsBtn">Levels</button>
    <button class="btn ghost" id="tutBtn">🎓 Tutorial</button>
    <button class="btn ghost" id="rulesBtn">How to play</button>
  </div>
</div>

<div class="ov hidden" id="ovBook">
  <div class="card">
    <h2 class="tf">PRICE BOOK</h2>
    <p class="sub" id="bookSub"></p>
    <div class="book" id="bookList"></div>
    <button class="btn ghost" data-back>Back</button>
  </div>
</div>

<div class="ov hidden" id="ovRules">
  <div class="card">
    <h2 class="tf">HOW TO PLAY</h2>
    <ul class="rules" id="rulesList"></ul>
    <button class="btn" data-back>Got it</button>
  </div>
</div>

<div class="ov hidden" id="ovLevels">
  <div class="card">
    <h2 class="tf">LEVELS</h2>
    <p class="sub" id="lvSub"></p>
    <div class="lvgrid" id="lvGrid"></div>
    <button class="btn ghost" data-back>Back</button>
  </div>
</div>

<div class="ov hidden" id="ovEnd">
  <div class="card">
    <h2 class="tf" id="eTitle">YOU WIN</h2>
    <div class="stars" id="eStars"></div>
    <p class="sub" id="eSub"></p>
    <div class="ledger" id="eLedger"></div>
    <div class="shop" id="eShop"></div>
    <button class="btn" id="eMain">NEXT LEVEL</button>
    <button class="btn ghost" id="eAlt">Play it again</button>
    <button class="btn ghost" id="eLevels">Levels</button>
  </div>
</div>

<div class="ov hidden" id="ovPause">
  <div class="card">
    <h2 class="tf">PAUSED</h2>
    <p class="sub" id="pLvl"></p>
    <button class="btn" id="pResume">RESUME</button>
    <div class="row2"><button class="btn ghost" id="pRestart">Restart</button><button class="btn ghost" id="pLevels">Levels</button></div>
    <button class="btn ghost quiet" id="pTut">🎓 Tutorial</button>
    <button class="btn ghost quiet" id="pQuit">Home</button>
    <p class="sub" id="pDiag" style="opacity:.4;font-size:11px;margin-top:14px"></p>
  </div>
</div>

<script>
(() => {
'use strict';
// ===================== SHARED: utilities (rarely touched) =====================
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const TF = 'Rubik, "Barlow Condensed", Impact, "Arial Narrow", sans-serif', BC = '"Barlow Condensed", "Arial Narrow", sans-serif';
let W = 390, H = 844, DPR = 1, k = 1, DPR_CAP = 2;
function resize() { DPR = Math.min(devicePixelRatio || 1, DPR_CAP); W = innerWidth; H = innerHeight; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); k = Math.min(W, H * 0.62) / 390; }
addEventListener('resize', resize);
const store = {
  get(key, d) { try { const v = localStorage.getItem('bp.' + key); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(key, v) { try { localStorage.setItem('bp.' + key, JSON.stringify(v)); } catch (e) {} }
};
let HEADLESS = false;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const TAU = Math.PI * 2;
const pick = (R, a) => a[(R() * a.length) | 0];
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
// Difficulty: curve(L) keeps rising for ever but slows after 60; easyOf(L) is 1 at level 1 falling to 0 at level 7 (LESSONS rule 0).
const curve = L => L <= 60 ? L : 60 + 15 * Math.log1p((L - 60) / 15);
const easyOf = L => clamp((7 - L) / 6, 0, 1);

// ---------- juice kit (PLAYBOOK S1-S11, P11) : copied into each game; keep in sync ----------
// Sound: one bus -> master -> compressor. Every play is pitch/volume varied. Ambience beds can be ducked.
let actx = null, MUTE = false, BUS = null, AMB = null; const lastPlay = {};
function audio() {
  if (!actx) {
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      const comp = actx.createDynamicsCompressor();
      comp.threshold.value = -18; comp.knee.value = 12; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.15;
      BUS = actx.createGain(); BUS.gain.value = MUTE ? 0 : 0.9; BUS.connect(comp); comp.connect(actx.destination);
      AMB = actx.createGain(); AMB.gain.value = 1; AMB.connect(BUS);
    } catch (e) { actx = null; }
  }
  if (actx && actx.state === 'suspended') actx.resume().catch(() => {});
}
function setMute(m) { MUTE = m; if (BUS) BUS.gain.setTargetAtTime(m ? 0 : 0.9, actx.currentTime, 0.02); }
const vary = (a = 0.06) => 1 + (Math.random() * 2 - 1) * a;
function gate(name, ms = 35) { const t = performance.now(); if (lastPlay[name] && t - lastPlay[name] < ms) return false; lastPlay[name] = t; return true; }
function env(g, t, vol, dur, att = 0.005) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + att); g.gain.exponentialRampToValueAtTime(0.0005, t + dur); }
function tone(fr, dur, vol, type = 'sine', when = 0, to, lp, dest) {
  if (!actx || MUTE) return;
  try {
    const t = actx.currentTime + when, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(fr, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    let n = o; if (lp) { const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp; o.connect(f); n = f; }
    env(g, t, vol, dur); n.connect(g); g.connect(dest || BUS); o.start(t); o.stop(t + dur + 0.03);
  } catch (e) {}
}
const NB = {};   // cached noise buffers
function nbuf(dur) { const k = Math.round(dur * 100); if (!NB[k]) { const n = Math.max(1, Math.floor(actx.sampleRate * dur)), b = actx.createBuffer(1, n, actx.sampleRate), d = b.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.5); NB[k] = b; } return NB[k]; }
function noise(dur, freq, vol, type = 'lowpass', q = 1, when = 0, att = 0.002, dest) {
  if (!actx || MUTE) return;
  try {
    const t = actx.currentTime + when, s = actx.createBufferSource(); s.buffer = nbuf(dur); s.playbackRate.value = vary(0.08);
    const f = actx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = actx.createGain(); env(g, t, vol, dur, att); s.connect(f); f.connect(g); g.connect(dest || BUS); s.start(t);
  } catch (e) {}
}
function pluck(fr, dur = 0.8, vol = 0.3, when = 0) {      // Karplus-Strong string
  if (!actx || MUTE) return;
  try {
    const sr = actx.sampleRate, n = Math.floor(sr * dur), b = actx.createBuffer(1, n, sr), d = b.getChannelData(0), p = Math.max(2, Math.round(sr / fr));
    for (let i = 0; i < p; i++) d[i] = Math.random() * 2 - 1;
    for (let i = p; i < n; i++) d[i] = 0.996 * 0.5 * (d[i - p] + d[i - p + 1]);
    const s = actx.createBufferSource(); s.buffer = b; const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 5000;
    const g = actx.createGain(); g.gain.value = vol; s.connect(f); f.connect(g); g.connect(BUS); s.start(actx.currentTime + when);
  } catch (e) {}
}
function echo(fn, delay = 0.075, level = 0.12) {          // one short slap-back (a sense of place)
  fn(1); setTimeout(() => fn(level), delay * 1000);
}
const PENTA = [0, 2, 4, 7, 9];
const note = (base, step) => base * Math.pow(2, (PENTA[step % 5] + 12 * Math.floor(step / 5)) / 12);
// Looping ambience bed (crowd, wind). Returns {set(level), stop()}.
function bed(freq, q, level, lfo = 0.15, type = 'bandpass') {
  if (!actx) return null;
  try {
    const n = actx.sampleRate * 3, b = actx.createBuffer(1, n, actx.sampleRate), d = b.getChannelData(0);
    let last = 0; for (let i = 0; i < n; i++) { last = last * 0.6 + (Math.random() * 2 - 1) * 0.4; d[i] = last; }
    const s = actx.createBufferSource(); s.buffer = b; s.loop = true;
    const f = actx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = actx.createGain(); g.gain.value = 0;
    const o = actx.createOscillator(), og = actx.createGain(); o.frequency.value = lfo; og.gain.value = level * 0.35; o.connect(og); og.connect(g.gain);
    s.connect(f); f.connect(g); g.connect(AMB); s.start(); o.start();
    const B = { g, f, base: level, set(v, tc = 0.4) { try { g.gain.setTargetAtTime(v, actx.currentTime, tc); } catch (e) {} }, stop() { try { s.stop(); o.stop(); } catch (e) {} } };
    B.set(level, 1.2); return B;
  } catch (e) { return null; }
}
function duck(amount = 0.5, ms = 400) {                   // drop ambience under a big moment
  if (!actx || !AMB) return;
  const t = actx.currentTime; AMB.gain.cancelScheduledValues(t); AMB.gain.setTargetAtTime(1 - amount, t, 0.02); AMB.gain.setTargetAtTime(1, t + ms / 1000, 0.15);
}
// Haptic vocabulary (silent sound channel). Never on failure.
const HAP = { tick: [10], light: [18], sharp: [22, 40, 30], thud: [70], heavy: [120, 50, 200], best: [20, 50, 30, 50, 60] };
function vibe(p) { try { if (window.GameNative && GameNative.vibrate) { GameNative.vibrate(JSON.stringify(p)); return; } navigator.vibrate && navigator.vibrate(p); } catch (e) {} }


// ===================== RULES: Block Party (game 64, set 11: a block puzzle, like Block Blast) =====================
// An 8 by 8 grid and a tray of three pieces. Drag a piece onto the grid; when all three are down, three more come. A full
// row or column clears (several at once score much more). Clearing again within your next few placements builds a COMBO
// that multiplies the score. It ends when none of the pieces in the tray fits anywhere. Each level has a goal: a score, or
// GEMS to collect (a gem in a cell is collected when its row or column clears). Later: junk blocks already on the board,
// bigger and awkward pieces, more gems.
const RULES = [
  '<b>Drag</b> a piece from the tray onto the grid. Three placed, three more come.',
  'Fill a whole <b>row or column</b> and it clears. Several at once score far more.',
  'Clear again within your next placements for a <b>COMBO</b>.',
  'Collect <b>gems</b> 💎 by clearing the row or column they sit in.',
  'It is over when no piece in the tray fits. Keep room for the big ones!',
];
const GRID = 8;
const SHAPES = {      // cells as [row, col]
  o1: [[0, 0]], i2: [[0, 0], [0, 1]], i3: [[0, 0], [0, 1], [0, 2]], i4: [[0, 0], [0, 1], [0, 2], [0, 3]], i5: [[0, 0], [0, 1], [0, 2], [0, 3], [0, 4]],
  o2: [[0, 0], [0, 1], [1, 0], [1, 1]], o3: [[0, 0], [0, 1], [0, 2], [1, 0], [1, 1], [1, 2], [2, 0], [2, 1], [2, 2]], r23: [[0, 0], [0, 1], [0, 2], [1, 0], [1, 1], [1, 2]],
  l3: [[0, 0], [1, 0], [1, 1]], l4: [[0, 0], [1, 0], [2, 0], [2, 1]], l5: [[0, 0], [1, 0], [2, 0], [2, 1], [2, 2]], t4: [[0, 0], [0, 1], [0, 2], [1, 1]], s4: [[0, 1], [0, 2], [1, 0], [1, 1]] };
const rot = cells => { const r = cells.map(([a, b]) => [b, -a]), mr = Math.min(...r.map(c => c[0])), mc = Math.min(...r.map(c => c[1])); return r.map(([a, b]) => [a - mr, b - mc]); };
const KINDS = []; for (const [k, s] of Object.entries(SHAPES)) { let c = s; const seen = new Set(); for (let i = 0; i < 4; i++) { const key = JSON.stringify(c.slice().sort()); if (!seen.has(key)) { seen.add(key); KINDS.push({ k, cells: c }); } c = rot(c); } }
const BCOL = ['#ff5a6a', '#ff9a3a', '#ffd23a', '#5ad86a', '#3ac8d8', '#4a8aff', '#a85aff', '#ff6ac8'];
const PLACES = [{ name: 'The Toy Box', bg: ['#2a3a6a', '#1a2448'] }, { name: 'The Arcade', bg: ['#3a1a5a', '#1a0e30'] }, { name: 'The Beach', bg: ['#1a6a8a', '#0e3a50'] }, { name: 'The Garden', bg: ['#2a5a3a', '#14301e'] }];
const placeOf = N => Math.floor((N - 1) / 6) % 4;
const UPGRADES = [
  { id: 'reroll', name: 'Reroll', desc: 'Once a level: swap the tray for three new pieces.', max: 1, cost: l => 60 },
  { id: 'bomb', name: 'Bomb', desc: 'Once a level: clear a 3 by 3 square.', max: 1, cost: l => 90 },
  { id: 'small', name: 'Kind pieces', desc: 'A few more small pieces.', max: 2, cost: l => 40 + l * 50 },
];
const upLv = id => (typeof HEADLESS !== 'undefined' && HEADLESS) ? 0 : ((store.get('ups', {}) || {})[id] | 0);
const RANKS = [[0, 'Beginner'], [40, 'Stacker'], [130, 'Builder'], [320, 'Architect'], [700, 'Master builder'], [1500, 'Legend']];
function makeCfg(N, help) { const f = curve(N), x = (a, b, s) => a + (b - a) * (1 - Math.exp(-f / s)), e = easyOf(N);
  const goal = N <= 2 ? 'score' : N === 3 ? 'gems' : (N % 3 === 0 ? 'score' : 'gems');      /* gems only once the gem lesson (level 3) has shown them */
  return { N, f, help: !!help, place: placeOf(N), goal, gems: Math.round(x(4, 10, 30)), target: Math.round(x(700, 2000, 60) / 50) * 50, junk: N >= 4 ? Math.round(x(4, 12, 30)) : 0,
    big: x(0.06, 0.2, 30) * (help ? 0.7 : 1), small: 0.15 * upLv('small') + 0.15 * e + (help ? 0.15 : 0), reroll: upLv('reroll'), bomb: upLv('bomb') }; }
function newGame(N, o = {}) { const cfg = makeCfg(N, o.help), seed = o.seed != null ? o.seed : (Math.random() * 1e9) | 0;
  const G = { N, cfg, seed, rnd: rng(seed), t: 0, over: null, res: null, ev: [], teach: !!o.teach, taught: o.taught | 0, lesson: null, place: cfg.place, wait: 0, next: null };
  setup(G); if (G.teach && LESSONS[N] && G.taught < N) lessonStart(G); else G.ev.push({ k: 'start' });
  return G; }
const idx = (r, c) => r * GRID + c;

    case 'goal': say('GOAL!', W / 2, L.by + L.bw * 0.4, '#ffe08a', 46); FX.flash = 0.6; sfx.goal(); vibe(HAP.best); for (let i = 0; i < 46; i++) { const a = Math.random() * TAU; PT.push({ x: W / 2, y: L.by + L.bw * 0.4, vx: Math.cos(a) * 340, vy: Math.sin(a) * 340 - 160, life: 1.1, t: 0, col: BCOL[i % 8], r: 3.5 }); } break;
    case 'lessonmiss': hint = { txt: e.how, t: 0, secs: 3.6 }; sfx.nope(); break;
    case 'lessonnext': if (e.first) hint = null; break;
    case 'lessonok': sfx.tick(); say(`${e.n} / ${e.need}`, W / 2, L.by + L.bw * 0.55, '#ffc23a', 26); break;
    case 'lessondone': say('YOU\'VE GOT IT!', W / 2, L.by + L.bw * 0.45, '#ffc23a', 30); sfx.goal(); if (!HEADLESS) store.set('taught', Math.max(store.get('taught', 0) | 0, e.N)); break;
    case 'won': sfx.win(); break;
    case 'lost': sfx.lose(); break;
  } }
function goalLine(G) { return G.cfg.goal === 'score' ? `Score ${G.cfg.target.toLocaleString()}` : `Collect ${G.cfg.gems} gems 💎`; }

// ===================== SOUND: the toy box (PLAYBOOK S1-S11) =====================
// Heard hundreds of times, so everything is short, soft and wooden-plastic: putting a piece down is a little "clack" (a
// filtered knock plus a low pluck, a touch deeper for a bigger piece, never quite the same twice, S2). A clear is a bright
// chime chord; more lines at once add voices, and each clear in a combo lifts the chord a step up the scale (S5), so a long
// combo climbs like a tune. A gem rings a crystal bell. New pieces arrive with three quick ticks. A drop that does not fit is
// a soft hollow knock, never harsh (S8). Out of room is a gentle falling pair.
const sfx = {
  click() { tone(880, 0.04, 0.05, 'triangle', 0, 1100); },
  start() { [0, 4, 7].forEach((q, j) => pluck(note(392, q + 5), 0.5, 0.07, j * 0.07)); },
  deal() { if (!gate('deal', 120)) return; for (let j = 0; j < 3; j++) noise(0.025, 2600 + j * 500, 0.035, 'bandpass', 2, j * 0.05); },
  place(n = 4) { if (!gate('place', 40)) return; const f = 190 * vary(0.06) * (n >= 6 ? 0.8 : n <= 2 ? 1.25 : 1); noise(0.04, 1500 * vary(0.1), 0.09, 'bandpass', 1.6); tone(f, 0.09, 0.09, 'triangle', 0, f * 0.7); pluck(f * 2, 0.18, 0.05, 0.005); },
  nope() { if (!gate('nope', 160)) return; tone(160, 0.12, 0.06, 'sine', 0, 120); noise(0.06, 600, 0.04, 'lowpass', 1); },
  clear(n = 1, streak = 1) { const st = Math.min(12, (streak - 1) * 2), base = note(523, st); [0, 4, 7, 12, 16, 19].slice(0, 2 + Math.min(4, n)).forEach((q, j) => tone(base * Math.pow(2, q / 12), 0.45, 0.05, 'sine', j * 0.03)); pluck(base, 0.5, 0.06);
    noise(0.22, 5000, 0.035, 'highpass', 0.7, 0, 0.01); if (n >= 2) tone(base / 2, 0.3, 0.08, 'triangle', 0, base / 2 * 1.5); },
  gem() { if (!gate('gem', 70)) return; tone(1976 * vary(0.02), 0.35, 0.05, 'sine'); tone(2637, 0.25, 0.03, 'sine', 0.05); },
  full() { tone(330, 0.3, 0.07, 'triangle', 0, 294); tone(262, 0.5, 0.07, 'triangle', 0.22, 220); },
  boom() { tone(80, 0.5, 0.16, 'sine', 0, 45); noise(0.4, 800, 0.1, 'lowpass', 0.8, 0, 0.005); },
  tick() { if (!gate('tick', 45)) return; tone(1320 + Math.random() * 200, 0.05, 0.03, 'triangle'); },
  goal() { [0, 4, 7, 12, 16].forEach((q, j) => pluck(note(392, q), 0.9, 0.08, j * 0.09)); },
  no() { if (!gate('no', 250)) return; tone(200, 0.1, 0.05, 'triangle', 0, 160, 900); },
  coin(i = 0) { tone(note(784, Math.min(10, i + 1)), 0.18, 0.07, 'triangle'); },
  combo(n = 1) { [0, 2, 4].forEach((q, j) => tone(note(523, q + Math.min(6, n)), 0.15, 0.06, 'triangle', j * 0.06)); },
  star(i = 0) { tone(note(784, 2 + i * 2), 0.45, 0.1, 'sine'); pluck(note(392, 2 + i * 2), 0.6, 0.1); },
  win() { [0, 4, 7, 12].forEach((q, j) => pluck(note(523, q), 1.0, 0.08, j * 0.12)); },
  lose() { tone(392, 0.4, 0.06, 'triangle', 0, 349); tone(330, 0.7, 0.06, 'triangle', 0.3, 294); },
};

// ===================== SHARED: screens, levels, pause, the feed, the frame loop, the test hook (rarely touched) =====================
// What every game must have (CLAUDE.md, LESSONS rules 4, 7, 11, 12) is all here, working off part2's newGame / step / finish:
//   - level memory: it opens on the level he was on; a win saves the next level at once; lower levels open, higher ones locked
//   - the pause menu: Resume, Restart, Levels (#pResume, #pRestart, #pLevels) and Home; window.gameFeedLevels() for the feed
//   - window.gameFeedStart('mini'): playing within a second of a tap on the card, at his own level, no menu or countdown
//   - help after three losses on a level (it only gives time: makeCfg's help), stars, best, a short loss moment (P23)
//   - the lessons of the first three levels (saved once passed)
//   - smoothness: the picture is made less sharp, a notch at a time, if this phone cannot keep up (rule 12)
let G = null, paused = false, level = 1, unlocked = store.get('unlocked', 1), stars = store.get('stars', {}), streaks = store.get('streaks', {}), best = store.get('best', {});
document.getElementById('rulesList').innerHTML = RULES.map(r => `<li>${r}</li>`).join('');
function show(id) { ['ovHome', 'ovRules', 'ovLevels', 'ovEnd', 'ovPause'].forEach(key => $(key).classList.toggle('hidden', key !== id)); }
function savedLevel() { level = Math.min(Math.max(1, store.get('level', 1) | 0), unlocked); }
const helpOn = () => (streaks[level] || 0) >= 3;
const playing = () => !!G && !G.over && !paused && $('ovHome').classList.contains('hidden') && $('ovEnd').classList.contains('hidden');
function showHome() {
  savedLevel(); G = null; paused = false; $('pauseBtn').classList.add('hidden');
  $('hLvl').textContent = level;
  const bank = store.get('bank', 0), tot = store.get('earned', 0), cf = makeCfg(level);
  $('hStat').innerHTML = [`<b>${bank}</b> coins · rank <b>${rankOf(tot)}</b>`, `${PLACES[cf.place].name} · ${cf.goal === 'score' ? 'score ' + cf.target.toLocaleString() : 'collect ' + cf.gems + ' gems'}`, best[level] ? `Your best score here: <b>${best[level].toLocaleString()}</b>` : '', helpOn() ? '<span class="help">Fewer big pieces for now.</span>' : ''].filter(Boolean).join('<br>');
  show('ovHome');
}
function startGame() {
  audio(); if (tutForce == null) tutRun = null; if (!HEADLESS && tutForce == null) store.set('level', level);
  G = newGame(level, { help: helpOn(), teach: true, taught: tutForce != null ? tutForce : store.get('taught', 0) | 0 }); paused = false; endT = 0;
  PT.length = 0; TXT.length = 0; ui.drag = null; BACK = null; born = {}; POPS.length = SWEEP.length = FLY.length = 0; FX.shake = FX.stop = FX.flash = FX.red = 0;
  if (!HEADLESS) { $('pauseBtn').classList.remove('hidden'); show(null); }
  last = performance.now(); warm = 30; winN = 0; winSum = 0;
}
function saveResult(G) {      // a win saves the next level at once (leaving before "Next" still brings him back to it)
  const r = G.res, L = G.N; if (HEADLESS) return;
  if (r.win) { streaks[L] = 0; stars[L] = Math.max(stars[L] || 0, r.stars); unlocked = Math.max(unlocked, L + 1); level = Math.min(unlocked, L + 1); store.set('level', level); store.set('unlocked', unlocked); store.set('stars', stars);
    if (r.score > (best[L] || 0)) { r.nb = best[L] != null; best[L] = r.score; store.set('best', best); } }
  else streaks[L] = (streaks[L] || 0) + 1;
  store.set('streaks', streaks);

  const before = rankOf(store.get('earned', 0)); store.set('bank', store.get('bank', 0) + r.coins); store.set('earned', store.get('earned', 0) + r.coins); r.rankUp = rankOf(store.get('earned', 0)) !== before ? rankOf(store.get('earned', 0)) : null;
}
function showEnd() {
  const r = G.res, L = G.N; $('pauseBtn').classList.add('hidden');
  $('eTitle').textContent = r.win ? 'CLEARED!' : 'NO ROOM LEFT'; $('eTitle').style.color = r.win ? 'var(--acc)' : '#ffb4a8';
  $('eStars').innerHTML = r.win ? [1, 2, 3].map(i => `<span class="${i <= r.stars ? '' : 'off'}">★</span>`).join('') : '';
  const need = r.goal === 'score' ? `${r.need.toLocaleString()} points` : `${r.need} gems`;
  $('eSub').innerHTML = `Score <b>${r.score.toLocaleString()}</b>` + (r.nb ? ' <b class="nb">NEW BEST</b>' : '') + (r.win ? ` · ${r.placed} pieces` : ` · goal <b>${Math.round(r.prog * 100)}%</b> of ${need}` + (r.prog >= 0.8 ? ' · <b>so close!</b>' : ''))
    + `<br>${r.lines} lines cleared` + (r.best >= 2 ? ` · best: ${r.best} at once` : '') + (r.win && r.stars < 3 ? '<br>Three stars: clear two or more lines at once, and use fewer pieces.' : '') + (!r.win ? '<br>Keep a space free for the long and the big pieces.' : '') + (r.rankUp ? `<br>New rank: <b>${r.rankUp}</b>` : '');
  $('eLedger').innerHTML = ''; renderShop();
  $('eMain').textContent = r.win ? 'NEXT LEVEL' : 'TRY AGAIN'; $('eMain').dataset.act = r.win ? 'next' : 'again';
  $('eAlt').classList.toggle('hidden', !r.win);
  show('ovEnd');
  if (r.win) [1, 2, 3].forEach(i => { if (i <= r.stars) setTimeout(() => sfx.star(i), 250 + i * 180); });
}
$('playBtn').onclick = () => { audio(); sfx.click(); startGame(); };
window.gameFeedStart = () => { savedLevel(); audio(); startGame(); };      // the feed's instant start: his level, playing at once
$('rulesBtn').onclick = () => { sfx.click(); show('ovRules'); };
$('levelsBtn').onclick = () => { sfx.click(); showLevels('home'); };
$('eLevels').onclick = () => showLevels('home');
$('eMain').onclick = () => { if ($('eMain').dataset.act === 'next') level = Math.min(unlocked, G.N + 1); startGame(); };
$('eAlt').onclick = () => { level = G.N; startGame(); };
let lvFrom = 'home', lvUnder = null;
function showLevels(from) {
  lvFrom = from || 'home'; lvUnder = ['ovHome', 'ovEnd'].find(key => !$(key).classList.contains('hidden')) || null;
  const top = Math.ceil((unlocked + 5) / 5) * 5; let h = '';
  for (let L = 1; L <= top; L++) { const lock = L > unlocked, st = stars[L] || 0; h += `<button class="lvb${L % 10 === 0 ? ' boss' : ''}${L === level ? ' cur' : ''}${lock ? ' lock' : ''}" data-l="${L}" ${lock ? 'disabled' : ''}>${lock ? '🔒' : L}<small>${lock ? '' : '★'.repeat(st)}</small></button>`; }
  $('lvGrid').innerHTML = h; $('lvSub').textContent = unlocked > 1 ? 'Every tenth level is a boss.' : 'Pass a level to open the next.';
  show('ovLevels');
}
$('lvGrid').addEventListener('click', e => {
  const b = e.target.closest('[data-l]'); if (!b || b.disabled) return;
  level = +b.dataset.l; store.set('level', level);
  if (lvFrom === 'home') showHome(); else { sfx.click(); startGame(); }      // picked from the pause menu or the feed: it starts at once
});
document.querySelectorAll('[data-back]').forEach(b => b.onclick = () => {
  const lv = !$('ovLevels').classList.contains('hidden');
  if (lv && lvFrom === 'pause' && G && !G.over) openPause(); else if (lv && lvFrom === 'feed' && lvUnder) show(lvUnder); else showHome();
});
function sndIcon() { $('sndBtn').textContent = MUTE ? '🔇' : '🔊'; }
MUTE = !!store.get('mute', false); sndIcon();
$('sndBtn').onclick = () => { audio(); setMute(!MUTE); store.set('mute', MUTE); sndIcon(); if (!MUTE) sfx.click(); };
// pause: the same three controls in every game
function openPause() { paused = true; $('pLvl').textContent = `Level ${G.N}`; $('pDiag').textContent = `Picture ${stepN + 1} of ${STEPS.length} · ${Math.round(1000 / ftAvg)} a second`; show('ovPause'); }
$('pauseBtn').onclick = () => { if (G && !G.over) openPause(); };
$('pResume').onclick = () => { paused = false; show(null); last = performance.now(); };
$('pRestart').onclick = () => { sfx.click(); level = G.N; startGame(); };
$('pLevels').onclick = () => showLevels('pause');
$('pQuit').onclick = () => showHome();
window.gameFeedLevels = () => { if (G && !G.over && $('ovHome').classList.contains('hidden')) { openPause(); showLevels('pause'); } else showLevels('feed'); };      // the feed's Levels button
document.addEventListener('visibilitychange', () => { if (document.hidden && G && !G.over && !paused) openPause(); });
// input (one thumb): put a finger on a piece in the tray and drag it; it rides above the finger, and its shadow shows where it
// will land. Let go over the grid to put it down; a drop where it does not fit sends it back to the tray (it costs nothing).
const ui = { drag: null };
function trayAt(x, y) { const L = lay(); if (y < L.ty - 20 * L.s || y > L.py + 2) return -1; let k = -1, bd = 1e9; for (let q = 0; q < 3; q++) { if (!G.tray[q]) continue; const d = Math.abs(x - L.slot(q)); if (d < bd && d < W * 0.17) { bd = d; k = q; } } return k; }
function cellAt(x, y) { const L = lay(), c = Math.floor((x - L.bx) / L.cs), r = Math.floor((y - L.by) / L.cs); return c >= 0 && c < GRID && r >= 0 && r < GRID ? [r, c] : null; }
function powerAt(x, y) { const L = lay(); return powers(G, L).find(p => x >= p.x - 6 && x <= p.x + p.w + 6 && y >= p.y - 8 && y <= p.y + p.h + 8) || null; }
cv.addEventListener('pointerdown', e => { audio(); if (!G || G.over || paused || G.wait > 0) return; const x = e.clientX, y = e.clientY;
  const pw = powerAt(x, y); if (pw) { if (pw.n <= 0) { sfx.no(); return; } if (pw.id === 'reroll') { reroll(G); ui.drag = null; } else { G.arm = !G.arm; sfx.click(); } return; }
  if (G.arm) { const rc = cellAt(x, y); if (rc) { G.arm = false; bomb(G, rc[0], rc[1]); } else G.arm = false; return; }
  const k = trayAt(x, y); if (k < 0) return; ui.drag = { id: e.pointerId, ti: k, x, y }; sfx.tick(); vibe(HAP.tick); try { cv.setPointerCapture(e.pointerId); } catch (err) {} });
cv.addEventListener('pointermove', e => { const d = ui.drag; if (!d || d.id !== e.pointerId) return; d.x = e.clientX; d.y = e.clientY; });
cv.addEventListener('pointerup', e => { const d = ui.drag; if (!d || d.id !== e.pointerId) return; const L = lay(), sp = dropSpot(L); ui.drag = null; if (!G || G.over) return;
  if (sp && sp.ok) { place(G, d.ti, sp.r, sp.c); return; }
  const onBoard = d.y - liftOf(L) < L.by + L.bw + L.cs; if (sp && onBoard) place(G, d.ti, sp.r, sp.c);      /* does not fit: the rules say so (and count it in a lesson) */
  BACK = { ti: d.ti, x: sp ? sp.px : d.x, y: sp ? sp.py : d.y, t: 0 }; });
cv.addEventListener('pointercancel', () => { if (ui.drag) BACK = { ti: ui.drag.ti, x: ui.drag.x, y: ui.drag.y, t: 0 }; ui.drag = null; });
const rankOf = tot => { let r = RANKS[0][1]; for (const [n, name] of RANKS) if (tot >= n) r = name; return r; };
function renderShop() { const el = $('eShop'); if (!el) return; const bank = store.get('bank', 0), ups = store.get('ups', {}) || {}; let h = `<h3><span>THE TOY SHOP</span><span>🪙 ${bank}</span></h3><div class="grid">`;
  for (const u of UPGRADES) { const lv = ups[u.id] | 0, max = lv >= u.max, cost = max ? 0 : u.cost(lv), can = !max && bank >= cost;
    h += `<button class="up ${max ? 'max' : can ? 'can' : 'no'}" data-u="${u.id}"><span class="cost">${max ? 'MAX' : cost + ' 🪙'}</span><b>${u.name}</b><span class="lv">${'●'.repeat(lv)}${'○'.repeat(u.max - lv)}</span><small>${u.desc}</small></button>`; }
  el.innerHTML = h + '</div>'; }
$('eShop').addEventListener('click', e => { const b = e.target.closest('[data-u]'); if (!b) return; audio(); const u = UPGRADES.find(q => q.id === b.dataset.u), ups = store.get('ups', {}) || {}, lv = ups[u.id] | 0, bank = store.get('bank', 0); if (lv >= u.max) return; const cost = u.cost(lv); if (bank < cost) { sfx.no(); return; }
  store.set('bank', bank - cost); ups[u.id] = lv + 1; store.set('ups', ups); sfx.combo(lv + 2); vibe(HAP.light); renderShop(); const nb = $('eShop').querySelector(`[data-u="${u.id}"]`); if (nb) nb.classList.add('bought'); });

// ---------- keeping it smooth (rule 12): ease the picture off a notch at a time if the phone is not keeping up ----------
const STEPS = [{ dpr: 2 }, { dpr: 1.5 }, { dpr: 1.25 }, { dpr: 1 }];
let stepN = clamp(store.get('smooth', 0) | 0, 0, STEPS.length - 1), ftAvg = 16.7, warm = 30, winN = 0, winSum = 0;
function applyStep() { DPR_CAP = STEPS[stepN].dpr; resize(); }
function measure(ms) {
  if (ms > 250) { warm = 20; return; } ftAvg += (Math.min(ms, 120) - ftAvg) * 0.06; if (warm > 0) { warm--; return; }
  winSum += Math.min(ms, 100); if (++winN < 60) return; const avg = winSum / winN; winN = 0; winSum = 0;
  if (avg > 21 && stepN < STEPS.length - 1) { stepN++; store.set('smooth', stepN); applyStep(); warm = 20; }
}
// ---------- the frame loop ----------
let last = performance.now(), endT = 0;
function frame(now) {
  const ms = now - last, rdt = clamp(ms / 1000, 0, 0.05); last = now;
  if (HEADLESS) { requestAnimationFrame(frame); return; }
  if (G && !paused && !G.over) measure(ms);
  if (G && !paused) {
    let dt = rdt; if (FX.stop > 0) { FX.stop -= rdt; dt = 0; }      // a heartbeat of stillness on a hit (P7)
    if (!G.over) step(G, dt);
    for (const e of G.ev) onEvent(G, e); if (tutRun && G.ev.some(e => e.k === 'lessondone')) tutNext();
    if (G.ev.length && G.over && !G.saved) { G.saved = true; saveResult(G); }
    G.ev.length = 0;
    if (G.over) { endT += rdt; if (endT > (G.res.win ? 1.0 : 0.7)) { endT = -1e9; showEnd(); } }      // a short moment, then the card (P23)
  }
  fxStep(rdt); draw(now / 1000);
  requestAnimationFrame(frame);
}
// ---------- the test hook (robots, tests, card clips) ----------
window.__sim = {
  async soundCheck() {   // renders every sound offline: catches errors and clipping
    const out = {}, keep = [actx, BUS, AMB, MUTE];
    for (const key of Object.keys(sfx)) {
      const oc = new OfflineAudioContext(1, 44100 * 3, 44100); actx = oc; MUTE = false;
      const comp = oc.createDynamicsCompressor(); comp.threshold.value = -18; comp.knee.value = 12; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.15;
      BUS = oc.createGain(); BUS.gain.value = 0.9; BUS.connect(comp); comp.connect(oc.destination); AMB = oc.createGain(); AMB.connect(BUS);
      for (const q in lastPlay) delete lastPlay[q]; for (const q in NB) delete NB[q];
      let err = null; try { sfx[key](1, 1); } catch (e) { err = String(e); }
      const buf = await oc.startRendering(), ch = buf.getChannelData(0); let pk = 0; for (const x of ch) pk = Math.max(pk, Math.abs(x));
      out[key] = err || +pk.toFixed(3);
    }
    [actx, BUS, AMB, MUTE] = keep; for (const q in NB) delete NB[q];
    return out;
  },
  start(N, o) { HEADLESS = true; MUTE = true; level = N; G = newGame(N, o || {}); },
  step(dt) { step(G, dt); G.ev.length = 0; },
  adv(sec) { for (let i = 0; i < sec * 60; i++) { if (!G.over) step(G, 1 / 60); for (const e of G.ev) onEvent(G, e); G.ev.length = 0; fxStep(1 / 60); } },
  place(ti, r, c) { return place(G, ti, r, c); }, fits(p, r, c) { return fits(G, p, r, c); }, reroll() { return reroll(G); }, bomb(r, c) { return bomb(G, r, c); }, lay, renderShop, idx, ui, dropSpot,
  go(N) { HEADLESS = false; level = N; startGame(); },
  playing, makeCfg, LESSONS, BLIND, honest, winNow() { winNow(G); }, live() { HEADLESS = false; last = performance.now(); },
  finest() { stepN = 0; applyStep(); }, smooth() { return { step: stepN, ms: +ftAvg.toFixed(1), dpr: DPR }; },
  skipTutorial() { skipTutorial(); }, startTutorial() { startTutorial(); }, get tutRun() { return tutRun; },
  get G() { return G; }
};
let tutForce = null;
// ---------- tutorials are optional (his rule, 18 Nov 2026): a SKIP TUTORIAL button on every lesson, and a Tutorial button
// always there (home and pause) that plays the lessons again, whatever level he is on ----------
let tutRun = null;
function startTutorial() { if (typeof LESSONS === 'undefined') return; const ns = [1, 2, 3].filter(n => LESSONS[n]); if (!ns.length) return; tutRun = { ns, i: 0, back: Math.min(Math.max(1, store.get('level', 1) | 0), unlocked) }; runTut(); }
function runTut() { const N = tutRun.ns[tutRun.i]; tutForce = N - 1; const keep = level; level = N; startGame(); level = keep; tutForce = null; }
function tutNext() { if (!tutRun) return; tutRun.i++; if (tutRun.i < tutRun.ns.length) { setTimeout(() => { if (tutRun) runTut(); }, 1200); return; } const back = tutRun.back; tutRun = null; setTimeout(() => { level = back; startGame(); }, 1500); }
function skipTutorial() { if (!G || !G.lesson) return; audio(); sfx.click(); store.set('taught', 3); const back = tutRun ? tutRun.back : G.N; tutRun = null; level = back; startGame(); }
$('skipTut').onclick = e => { e.stopPropagation(); skipTutorial(); };
['pointerdown', 'touchstart'].forEach(k => $('skipTut').addEventListener(k, e => e.stopPropagation(), { passive: true }));
$('tutBtn').onclick = () => { audio(); sfx.click(); startTutorial(); };
$('pTut').onclick = () => { sfx.click(); paused = false; startTutorial(); };
setInterval(() => { const on = !!(G && G.lesson && !G.over && !paused && !HEADLESS); $('skipTut').classList.toggle('hidden', !on); }, 150);
window.gameFeedTutorial = () => { audio(); startTutorial(); };
applyStep(); showHome(); requestAnimationFrame(frame);
})();
