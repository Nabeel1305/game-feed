<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Haggle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow+Condensed:wght@600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* STARTER KIT (kit/README.md). Colours: change the five below and the game's whole look follows. */
:root{--bg:#1e160e;--ink:#f6efe4;--acc:#e8b85a;--acc-dark:#8a6224;--ok:#9be3b5}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.tf{font-family:"Alfa Slab One","Barlow Condensed",Impact,"Arial Narrow",sans-serif;font-weight:400;letter-spacing:1px}
#pauseBtn{position:fixed;left:50%;transform:translateX(-50%);top:10px;z-index:3;width:40px;height:30px;border-radius:10px;border:0;background:rgba(0,0,0,.35);color:var(--ink);font-weight:800;cursor:pointer}
#pauseBtn.hidden{display:none}
.ov{position:fixed;inset:0;z-index:5;display:flex;align-items:safe center;justify-content:center;overflow-y:auto;background:radial-gradient(circle at 50% 30%,rgba(16,20,31,.55),rgba(6,8,14,.93))}
.ov.hidden,.btn.hidden{display:none}
.card{width:calc(100% - 44px);max-width:360px;text-align:center;max-height:100%;overflow:auto;padding:20px 0}
.card h1{margin:0;font-size:76px;line-height:.95;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.35),0 12px 28px rgba(0,0,0,.55)}
.card h2{margin:0;font-size:42px;line-height:1;color:#fff}
.bar{height:3px;width:150px;margin:10px auto 9px;background:linear-gradient(90deg,transparent,var(--acc),transparent)}
.tag{font-size:12px;font-weight:800;letter-spacing:2.5px;opacity:.85}
.vs{margin:18px 0 4px;font-size:12px;letter-spacing:2px;opacity:.7;font-weight:800}
.sub{opacity:.9;font-size:14px;margin:10px 0 0;line-height:1.5}
.stat{font-size:13px;margin-top:12px;opacity:.92;line-height:1.5}
.btn{display:block;width:100%;margin-top:16px;border:0;border-radius:14px;padding:16px;font:inherit;font-size:20px;font-weight:800;background:var(--acc);color:#1d1204;box-shadow:0 5px 0 var(--acc-dark);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--acc-dark)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border:1.5px solid rgba(238,242,248,.3);font-size:16px;padding:13px;margin-top:10px}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
#ovPause,#ovLevels{background:radial-gradient(circle at 50% 30%,rgba(14,18,28,.94),rgba(6,8,14,.97))}
.btn.quiet{border-color:transparent;opacity:.6;font-size:14px;padding:10px;margin-top:6px}
.rules{list-style:none;padding:0;margin:14px 0 0;text-align:left}
.rules li{padding:0 0 11px 0;font-size:14px;line-height:1.45;opacity:.95}
.rules b{color:var(--acc)}
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:16px;max-height:56vh;overflow:auto;padding:4px 2px}
.lvb{border:0;border-radius:12px;padding:10px 0 6px;font:inherit;font-weight:800;font-size:17px;background:rgba(255,255,255,.1);color:var(--ink);cursor:pointer}
.lvb small{display:block;font-size:10px;color:var(--acc);min-height:12px;letter-spacing:1px}
.lvb.boss{box-shadow:inset 0 0 0 2px var(--acc)}
.lvb.cur{background:var(--acc);color:#1d1204}.lvb.cur small{color:#1d1204}
.lvb.lock{opacity:.3}
.stars{font-size:34px;letter-spacing:6px;margin-top:8px;color:var(--acc)}
.stars .off{color:rgba(255,255,255,.2)}
.snd{position:absolute;right:14px;bottom:16px;width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:18px;cursor:pointer}
.nb{color:var(--acc)}.help{color:var(--ok);font-size:12.5px}
#skipTut{position:fixed;right:10px;top:10px;z-index:4;border:0;border-radius:16px;padding:8px 14px;font:inherit;font-weight:800;font-size:14px;background:var(--acc);color:#1d1204;box-shadow:0 3px 10px rgba(0,0,0,.4);cursor:pointer}#skipTut.hidden{display:none}
.shop{margin-top:14px;text-align:left}.shop h3{margin:0 0 6px;font-size:13px;letter-spacing:2px;opacity:.8;display:flex;justify-content:space-between}
.shop .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.up{border:1.5px solid rgba(255,255,255,.18);border-radius:12px;padding:8px 9px;background:rgba(0,0,0,.25);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.up b{display:block;font-size:14px}.up small{display:block;font-size:11px;opacity:.75;line-height:1.3;margin-top:2px}.up .lv{font-size:11px;letter-spacing:2px;color:var(--acc)}.up .cost{float:right;font-weight:800;font-size:13px}
.up.can{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}.up.max{opacity:.5}.up.no{opacity:.55}.up.bought{animation:pop .35s}@keyframes pop{50%{transform:scale(1.06)}}
#ovPause,#ovLevels{background:radial-gradient(circle at 50% 30%,rgba(14,18,28,.94),rgba(6,8,14,.97))}

#eTitle{font-size:34px}.ledger{text-align:left;margin-top:10px;font-size:13px}.ledger .ln{display:flex;justify-content:space-between;background:rgba(255,255,255,.07);border-radius:9px;padding:6px 9px;margin-top:5px}.ledger .g{color:#9be3b5}.ledger .b{color:#ffb4a8}
.book{text-align:left;margin-top:10px;font-size:13.5px}.book .ln{display:flex;justify-content:space-between;background:rgba(255,255,255,.07);border-radius:9px;padding:7px 10px;margin-top:6px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button id="skipTut" class="hidden">Skip tutorial ›</button>
<button id="pauseBtn" class="hidden" aria-label="Pause">II</button>

<div class="ov" id="ovHome">
  <button class="snd" id="sndBtn" aria-label="Sound">🔊</button>
  <div class="card">
    <h1 class="tf">Haggle</h1>
    <div class="bar"></div>
    <div class="tag" id="hTag">Know the worth. Pay less.</div>
    <div class="vs">LEVEL <span id="hLvl">1</span></div>
    <div class="stat" id="hStat"></div>
    <button class="btn" id="playBtn">PLAY</button>
    <button class="btn ghost" id="bookBtn">📒 Price Book</button>
    <button class="btn ghost" id="levelsBtn">Levels</button>
    <button class="btn ghost" id="tutBtn">🎓 Tutorial</button>
    <button class="btn ghost" id="rulesBtn">How to play</button>
  </div>
</div>

<div class="ov hidden" id="ovBook">
  <div class="card">
    <h2 class="tf">PRICE BOOK</h2>
    <p class="sub" id="bookSub"></p>
    <div class="book" id="bookList"></div>
    <button class="btn ghost" data-back>Back</button>
  </div>
</div>

<div class="ov hidden" id="ovRules">
  <div class="card">
    <h2 class="tf">HOW TO PLAY</h2>
    <ul class="rules" id="rulesList"></ul>
    <button class="btn" data-back>Got it</button>
  </div>
</div>

<div class="ov hidden" id="ovLevels">
  <div class="card">
    <h2 class="tf">LEVELS</h2>
    <p class="sub" id="lvSub"></p>
    <div class="lvgrid" id="lvGrid"></div>
    <button class="btn ghost" data-back>Back</button>
  </div>
</div>

<div class="ov hidden" id="ovEnd">
  <div class="card">
    <h2 class="tf" id="eTitle">YOU WIN</h2>
    <div class="stars" id="eStars"></div>
    <p class="sub" id="eSub"></p>
    <div class="ledger" id="eLedger"></div>
    <div class="shop" id="eShop"></div>
    <button class="btn" id="eMain">NEXT LEVEL</button>
    <button class="btn ghost" id="eAlt">Play it again</button>
    <button class="btn ghost" id="eLevels">Levels</button>
  </div>
</div>

<div class="ov hidden" id="ovPause">
  <div class="card">
    <h2 class="tf">PAUSED</h2>
    <p class="sub" id="pLvl"></p>
    <button class="btn" id="pResume">RESUME</button>
    <div class="row2"><button class="btn ghost" id="pRestart">Restart</button><button class="btn ghost" id="pLevels">Levels</button></div>
    <button class="btn ghost quiet" id="pTut">🎓 Tutorial</button>
    <button class="btn ghost quiet" id="pQuit">Home</button>
    <p class="sub" id="pDiag" style="opacity:.4;font-size:11px;margin-top:14px"></p>
  </div>
</div>

<script>
(() => {
'use strict';
// ===================== SHARED: utilities (rarely touched) =====================
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const TF = '"Alfa Slab One", "Barlow Condensed", Impact, "Arial Narrow", sans-serif', BC = '"Barlow Condensed", "Arial Narrow", sans-serif';
let W = 390, H = 844, DPR = 1, k = 1, DPR_CAP = 2;
function resize() { DPR = Math.min(devicePixelRatio || 1, DPR_CAP); W = innerWidth; H = innerHeight; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); k = Math.min(W, H * 0.62) / 390; }
addEventListener('resize', resize);
const store = {
  get(key, d) { try { const v = localStorage.getItem('hg.' + key); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(key, v) { try { localStorage.setItem('hg.' + key, JSON.stringify(v)); } catch (e) {} }
};
let HEADLESS = false;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const TAU = Math.PI * 2;
const pick = (R, a) => a[(R() * a.length) | 0];
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
// Difficulty: curve(L) keeps rising for ever but slows after 60; easyOf(L) is 1 at level 1 falling to 0 at level 7 (LESSONS rule 0).
const curve = L => L <= 60 ? L : 60 + 15 * Math.log1p((L - 60) / 15);
const easyOf = L => clamp((7 - L) / 6, 0, 1);

// ---------- juice kit (PLAYBOOK S1-S11, P11) : copied into each game; keep in sync ----------
// Sound: one bus -> master -> compressor. Every play is pitch/volume varied. Ambience beds can be ducked.
let actx = null, MUTE = false, BUS = null, AMB = null; const lastPlay = {};
function audio() {
  if (!actx) {
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      const comp = actx.createDynamicsCompressor();
      comp.threshold.value = -18; comp.knee.value = 12; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.15;
      BUS = actx.createGain(); BUS.gain.value = MUTE ? 0 : 0.9; BUS.connect(comp); comp.connect(actx.destination);
      AMB = actx.createGain(); AMB.gain.value = 1; AMB.connect(BUS);
    } catch (e) { actx = null; }
  }
  if (actx && actx.state === 'suspended') actx.resume().catch(() => {});
}
function setMute(m) { MUTE = m; if (BUS) BUS.gain.setTargetAtTime(m ? 0 : 0.9, actx.currentTime, 0.02); }
const vary = (a = 0.06) => 1 + (Math.random() * 2 - 1) * a;
function gate(name, ms = 35) { const t = performance.now(); if (lastPlay[name] && t - lastPlay[name] < ms) return false; lastPlay[name] = t; return true; }
function env(g, t, vol, dur, att = 0.005) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + att); g.gain.exponentialRampToValueAtTime(0.0005, t + dur); }
function tone(fr, dur, vol, type = 'sine', when = 0, to, lp, dest) {
  if (!actx || MUTE) return;
  try {
    const t = actx.currentTime + when, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(fr, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    let n = o; if (lp) { const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp; o.connect(f); n = f; }
    env(g, t, vol, dur); n.connect(g); g.connect(dest || BUS); o.start(t); o.stop(t + dur + 0.03);
  } catch (e) {}
}
const NB = {};   // cached noise buffers
function nbuf(dur) { const k = Math.round(dur * 100); if (!NB[k]) { const n = Math.max(1, Math.floor(actx.sampleRate * dur)), b = actx.createBuffer(1, n, actx.sampleRate), d = b.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.5); NB[k] = b; } return NB[k]; }
function noise(dur, freq, vol, type = 'lowpass', q = 1, when = 0, att = 0.002, dest) {
  if (!actx || MUTE) return;
  try {
    const t = actx.currentTime + when, s = actx.createBufferSource(); s.buffer = nbuf(dur); s.playbackRate.value = vary(0.08);
    const f = actx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = actx.createGain(); env(g, t, vol, dur, att); s.connect(f); f.connect(g); g.connect(dest || BUS); s.start(t);
  } catch (e) {}
}
function pluck(fr, dur = 0.8, vol = 0.3, when = 0) {      // Karplus-Strong string
  if (!actx || MUTE) return;
  try {
    const sr = actx.sampleRate, n = Math.floor(sr * dur), b = actx.createBuffer(1, n, sr), d = b.getChannelData(0), p = Math.max(2, Math.round(sr / fr));
    for (let i = 0; i < p; i++) d[i] = Math.random() * 2 - 1;
    for (let i = p; i < n; i++) d[i] = 0.996 * 0.5 * (d[i - p] + d[i - p + 1]);
    const s = actx.createBufferSource(); s.buffer = b; const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 5000;
    const g = actx.createGain(); g.gain.value = vol; s.connect(f); f.connect(g); g.connect(BUS); s.start(actx.currentTime + when);
  } catch (e) {}
}
function echo(fn, delay = 0.075, level = 0.12) {          // one short slap-back (a sense of place)
  fn(1); setTimeout(() => fn(level), delay * 1000);
}
const PENTA = [0, 2, 4, 7, 9];
const note = (base, step) => base * Math.pow(2, (PENTA[step % 5] + 12 * Math.floor(step / 5)) / 12);
// Looping ambience bed (crowd, wind). Returns {set(level), stop()}.
function bed(freq, q, level, lfo = 0.15, type = 'bandpass') {
  if (!actx) return null;
  try {
    const n = actx.sampleRate * 3, b = actx.createBuffer(1, n, actx.sampleRate), d = b.getChannelData(0);
    let last = 0; for (let i = 0; i < n; i++) { last = last * 0.6 + (Math.random() * 2 - 1) * 0.4; d[i] = last; }
    const s = actx.createBufferSource(); s.buffer = b; s.loop = true;
    const f = actx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = actx.createGain(); g.gain.value = 0;
    const o = actx.createOscillator(), og = actx.createGain(); o.frequency.value = lfo; og.gain.value = level * 0.35; o.connect(og); og.connect(g.gain);
    s.connect(f); f.connect(g); g.connect(AMB); s.start(); o.start();
    const B = { g, f, base: level, set(v, tc = 0.4) { try { g.gain.setTargetAtTime(v, actx.currentTime, tc); } catch (e) {} }, stop() { try { s.stop(); o.stop(); } catch (e) {} } };
    B.set(level, 1.2); return B;
  } catch (e) { return null; }
}
function duck(amount = 0.5, ms = 400) {                   // drop ambience under a big moment
  if (!actx || !AMB) return;
  const t = actx.currentTime; AMB.gain.cancelScheduledValues(t); AMB.gain.setTargetAtTime(1 - amount, t, 0.02); AMB.gain.setTargetAtTime(1, t + ms / 1000, 0.15);
}
// Haptic vocabulary (silent sound channel). Never on failure.
const HAP = { tick: [10], light: [18], sharp: [22, 40, 30], thud: [70], heavy: [120, 50, 200], best: [20, 50, 30, 50, 60] };
function vibe(p) { try { if (window.GameNative && GameNative.vibrate) { GameNative.vibrate(JSON.stringify(p)); return; } navigator.vibrate && navigator.vibrate(p); } catch (e) {} }

// ===================== RULES: Haggle (game 46, his idea) =====================
// You run a pawn shop. One by one, people come in with something to sell and a price in mind. Look it over (the maker, the
// state it is in, what they say about it), check it if you doubt it (the loupe for signatures and hallmarks, the UV lamp for
// fakes; each look tries their patience), then haggle: drag the dial to your offer and OFFER. Too low and they are insulted
// (their patience drops, and they may walk out); high enough and they counter or take it; pay more than it is worth and you
// lose. At closing time everything you bought sells for what it is really worth: the day's profit against the target. Every
// sale teaches the Price Book what things fetch, so you slowly learn the value of everything, as a pawnbroker does.
const RULES = [
  'Someone brings in an item and names a price. Look at <b>what it is, who made it, the state it is in</b>.',
  'In doubt? <b>🔍 Loupe</b> checks signatures and hallmarks, <b>🔦 UV</b> spots fakes. Each look tries their patience.',
  '<b>Drag the dial</b> to your offer and tap <b>OFFER</b>. Too low insults them; they may walk. They will counter.',
  'Pay less than it is worth: at <b>closing</b> it sells for its real value. Make the day\'s profit target.',
  'Every sale fills your <b>Price Book</b>: you learn what things are worth.',
];
// the kinds of thing people bring, what a good one fetches, and three makers (cheap, middling, fine) for each
const TYPES = [
  { id: 'watch', name: 'Wristwatch', base: 320, makers: ['Tikka', 'Marlowe', 'Kronos'], lux: true, n: 1 },
  { id: 'guitar', name: 'Electric guitar', base: 420, makers: ['Strum', 'Halcyon', 'Gibbard'], n: 1 },
  { id: 'ring', name: 'Ring', base: 480, makers: ['Plated', 'Silver', '18ct gold'], lux: true, n: 1 },
  { id: 'camera', name: 'Camera', base: 260, makers: ['Snappy', 'Orion', 'Leitzmann'], n: 1 },
  { id: 'comic', name: 'Comic book', base: 120, makers: ['Reprint', 'Original', 'Rare issue'], ed: true, n: 2 },
  { id: 'sneakers', name: 'Trainers', base: 180, makers: ['Strider', 'Airflow', 'Limited drop'], lux: true, n: 2 },
  { id: 'vase', name: 'Vase', base: 220, makers: ['Modern', 'Victorian', 'Ming-style'], lux: true, n: 3 },
  { id: 'coin', name: 'Old coin', base: 150, makers: ['Copper', 'Silver', 'Gold'], lux: true, n: 3 },
  { id: 'console', name: 'Games console', base: 230, makers: ['Retrobox', 'PlayZone', 'Prototype'], n: 4 },
  { id: 'painting', name: 'Painting', base: 600, makers: ['Print', 'Amateur oil', 'Old master'], lux: true, sig: true, n: 5 },
  { id: 'violin', name: 'Violin', base: 700, makers: ['Student', 'Workshop', 'Cremona-style'], lux: true, n: 7 },
  { id: 'handbag', name: 'Handbag', base: 380, makers: ['High street', 'Bellini', 'Maison Vey'], lux: true, n: 9 },
];
const TIER = [0.35, 1, 2.6], COND = [{ t: 'mint, still boxed', m: 1.3 }, { t: 'in good shape', m: 1 }, { t: 'worn and scratched', m: 0.6 }, { t: 'broken', m: 0.25 }];
const SELLERS = [
  { id: 'desperate', name: 'needs the money today', walk: [0.35, 0.5], ask: [1.0, 1.2], pat: 5, face: 0 },
  { id: 'casual', name: 'clearing out the loft', walk: [0.45, 0.62], ask: [1.05, 1.4], pat: 5, face: 1 },
  { id: 'savvy', name: 'knows what it is worth', walk: [0.68, 0.82], ask: [1.1, 1.5], pat: 4, face: 2 },
  { id: 'shady', name: 'in a hurry, no questions', walk: [0.3, 0.5], ask: [1.0, 1.6], pat: 4, face: 3 },
];
const PLACES = [{ name: 'Market Street' }, { name: 'The High Street' }, { name: 'Antiques Row' }, { name: 'Bond Street' }];
const placeOf = N => Math.min(3, Math.floor((N - 1) / 6));
const UPGRADES = [
  { id: 'book', name: 'Price guide', desc: 'The Price Book shows its ranges while you haggle.', max: 1, cost: l => 40 },
  { id: 'charm', name: 'Kettle on', desc: 'A cup of tea: everyone has one more patience.', max: 1, cost: l => 45 },
  { id: 'window', name: 'Shop window', desc: 'Things sell for 10% more.', max: 2, cost: l => 35 + l * 40 },
];
const upLv = id => (typeof HEADLESS !== 'undefined' && HEADLESS) ? 0 : ((store.get('ups', {}) || {})[id] | 0);
const RANKS = [[0, 'Junk dealer'], [40, 'Pawnbroker'], [130, 'Antiques dealer'], [320, 'Auction house'], [700, 'Collector'], [1500, 'Tycoon']];
function makeCfg(N, help) { const f = curve(N), x = (a, b, s) => a + (b - a) * (1 - Math.exp(-f / s));
  return { N, f, help: !!help, place: placeOf(N), people: Math.round(x(7, 9, 25)), target: 0, share: x(0.13, 0.25, 30), vs: x(1, 3.2, 30),
    fakes: N >= 3 ? x(0.12, 0.3, 30) : 0, claims: N >= 2 ? x(0.25, 0.5, 30) : 0, hot: N >= 4, types: TYPES.filter(t => t.n <= N), sell: 1 + 0.1 * upLv('window'), pat: upLv('charm') }; }
// one customer and the thing they bring
