name: Check all games
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  check:
    name: Check the games and the feed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ledger is up to date
        run: python3 tools/ledger.py --check
      - name: Install browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Load every game
        run: python3 tools/check.py
      - name: Test the feed
        run: python3 tools/test_feed.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Test the part of the phone app that fetches new games
        run: python3 tools/test_sync.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            out/*.png
            out/feed/

  # Installed phone apps look here for new games. The built feed app goes on the "app" branch; every time the
  # phone app opens it reads manifest.txt from that branch and fetches whatever is new (android/.../Sync.java).
  # Nothing is published unless every check above passed.
  publish:
    name: Publish the feed for installed apps
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-app
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: Build the feed app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: python3 tools/build_feed.py --out "$RUNNER_TEMP/app"
      - name: Put it on the app branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/app"
          git init -q -b app
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Feed app, build ${{ github.run_number }} (from ${GITHUB_SHA::7})"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" app:app
          echo "Published build ${{ github.run_number }}: $(head -1 manifest.txt)" >> "$GITHUB_STEP_SUMMARY"

  # The phone app: the feed and every game inside one Android app, built after the checks pass.
  # Every run builds it once unsigned-for-release (a debug build) to prove the app still builds.
  # The real, installable GameFeed.apk needs the KEYSTORE_PASSWORD secret (see android/signing/README.md);
  # without it this job says so and stops there.
  apk:
    name: Build the phone app
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Put the feed and the games inside the app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: python3 tools/build_feed.py --out android/app/src/main/assets
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: The app builds
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: GameFeed-test-build
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Is the signing password there?
        id: key
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::GameFeed.apk was not made. Add the KEYSTORE_PASSWORD secret (Settings > Secrets and variables > Actions), then run this workflow again."
            echo "The app builds, but **GameFeed.apk was not made**: the \`KEYSTORE_PASSWORD\` secret is missing. Add it under Settings > Secrets and variables > Actions, then run this workflow again." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=no" >> "$GITHUB_OUTPUT"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Build signed APK
        if: steps.key.outputs.ready == 'yes'
        working-directory: android
        env:
          KEY_ALIAS: gamefeed
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          export KEYSTORE_FILE="$GITHUB_WORKSPACE/android/signing/release.p12"
          gradle :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/GameFeed.apk"
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.ready == 'yes'
        with:
          name: GameFeed-apk
          path: GameFeed.apk
      - name: Publish release
        if: steps.key.outputs.ready == 'yes'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Game Feed (build ${{ github.run_number }})
          body: Download GameFeed.apk below and open it on your Android phone to install. New builds install over the old one and keep your progress.
          files: GameFeed.apk
          make_latest: true
